<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Gestión de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Panel Administrativo</ion-card-title>
      <ion-card-subtitle>Control central de cuentas y permisos</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí irá el listado de usuarios, filtros por sede y el formulario de creación/edición.</p>

      <!-- Botón de prueba para acciones CRUD -->
      <ion-button expand="block" class="ion-margin-top">
        <ion-icon name="person-add-outline" slot="start"></ion-icon>
        Registrar Nuevo Usuario
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
