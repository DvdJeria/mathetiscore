<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Panel Docente</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Mis Cursos Asignados</ion-card-title>
      <ion-card-subtitle>Periodo Académico Actual</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí se mostrarán los ramos actuales del profesor con accesos directos a la toma de asistencia.</p>

      <ion-button expand="block" routerLink="/docente/tomar-asistencia" color="tertiary" class="ion-margin-top">
        <ion-icon name="checkbox-outline" slot="start"></ion-icon>
        Ir a Tomar Asistencia
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
